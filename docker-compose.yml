services:
  sglang:
    # Pinned 2026-06-27 (audit remediation R8). Floating ``latest``
    # tags were the audit's R8 finding. Bump quarterly; see
    # docs/docker-image-pinning.md for the rationale (we prefer
    # minor-version pinning over digest pinning to preserve layered
    # image caching and easy cross-registry promotion).
    #
    # NB: the previous pin (``v0.4.10-cu130-runtime``) never
    # existed on Docker Hub — the v0.4.10 series only ships
    # ``-cu126`` / ``-cu128-{b200,gb200}`` / ``-xeon`` suffixes;
    # ``-cu130-runtime`` only appears from v0.5.13 onward. Bumping
    # to v0.5.14 here so Blackwell (RTX PRO 6000 / RTX 5070, sm_120)
    # can actually run the container.
    #
    # Profile note: sglang is opt-in via ``--profile sglang``. As of
    # 2026-06-30 vLLM is the default local backend — a bare
    # ``docker compose up`` starts vllm, not sglang. To run sglang
    # instead, stop the vllm container first (both bind port 30000)
    # then ``docker compose --profile sglang up sglang``.
    profiles:
      - sglang
    image: lmsysorg/sglang:v0.5.14-cu130-runtime
    # Read HF_TOKEN / CUDA / etc. from a local .env file. Copy
    # .env.example to .env and fill in the values; the .env file is
    # gitignored.
    env_file:
      - .env
    ports:
      - "30000:30000"
    volumes:
      # This maps your host cache to the container's default Hugging Face cache path
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
    ipc: host
    shm_size: '32gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Model path is overridable via LLM_MODEL in .env. Default falls
    # back to the NVIDIA NVFP4 quant so a fresh ``docker compose up``
    # serves it; older Qwen3.5-35B-A3B (BF16, larger on disk) still
    # works by setting LLM_MODEL=Qwen/Qwen3.5-35B-A3B in .env.
    # NVFP4 also needs NVFP4/MoE flags; for the MoE NVFP4 quant
    # (35B-A3B-NVFP4) pass LLM_MOE=1 to enable --moe-backend.
    command: ["sh", "-c", "pip install --no-cache-dir distro && pip uninstall -y torchcodec && exec python3 -m sglang.launch_server --model-path ${LLM_MODEL:-nvidia/Qwen3.6-27B-NVFP4} --host 0.0.0.0 --port 30000 --mem-fraction-static 0.9 --attention-backend triton --tool-call-parser qwen --reasoning-parser qwen3 --grammar-backend xgrammar --trust-remote-code"]
  vllm:
    # vLLM as the default local-inference backend (since 2026-06-30).
    # A bare ``docker compose up`` starts vllm + neo4j; the sglang
    # service is opt-in via ``--profile sglang``. Both bind port 30000
    # so they cannot run concurrently — swap by stopping the active
    # one and starting the other; the OpenAI-compatible client URL
    # (http://localhost:30000/v1) stays the same.
    #
    # Pinned 2026-06-30: v0.24.0 is the upstream version tested
    # with NVFP4 + MTP for Qwen3.6. Bump per
    # docs/docker-image-pinning.md (quarterly cadence).
    #
    # NVFP4 + Blackwell (sm_100 / sm_120) is required: NVFP4 uses
    # Blackwell's FP4 Tensor Core + NVLS hardware instructions and
    # will not load on H100/H200/A100. The project already runs on
    # RTX PRO 6000 / RTX 5070 (sm_120) per the sglang comment above.
    image: vllm/vllm-openai:v0.24.0
    # v0.24.0 image has ENTRYPOINT=["vllm","serve"], so a plain
    # ``command: [sh, -c, ...]`` would actually exec
    # ``vllm serve sh -c <script>`` — vLLM then parses the script
    # body as a positional arg and dies with
    # ``CompilationConfig: Invalid JSON``. Setting entrypoint to an
    # empty string drops the prepended ``vllm serve`` so our ``sh -c``
    # runs as-is.
    entrypoint: ""
    # NB: we deliberately do NOT use ``env_file: .env`` here.
    # vLLM v0.24.0 has strict env-var validation and warns about
    # every ``VLLM_*`` (and ``VLLM_BUILD_*`` baked into the image)
    # it doesn't recognize. The Python client only needs those
    # vars on the host, not inside the container. So we whitelist
    # only what vLLM itself consumes. Compose still resolves
    # ``${HF_TOKEN}`` from the project-root .env file (the
    # auto-loaded one) when rendering the YAML — we just don't
    # forward every key into the container.
    #
    # VLLM_WORKER_MULTIPROC_METHOD=fork used to be set here, but
    # vLLM v0.24.0 forces ``spawn`` anyway once CUDA is initialized
    # (and warns about the override). Removed.
    ports:
      - "30000:30000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
    ipc: host
    shm_size: '32gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Default model is NVIDIA's official NVFP4 quant
    # (nvidia/Qwen3.6-27B-NVFP4). Override with LLM_MODEL in .env.
    # MTP speculative decoding is enabled by default because the
    # Qwen3.6 architecture ships with MTP weights; set
    # LLM_ENABLE_MTP=0 in .env to disable it for checkpoints that
    # lack MTP tensors (the --speculative-config flag will error
    # out otherwise).
    #
    # The sh wrapper does shell-side substitution so the JSON for
    # --speculative-config can be emitted literally. We avoid YAML
    # block scalars (``|``) here because Compose only interpolates
    # ``$$`` → ``$`` inside flow-style scalars — block scalars
    # would pass the literal ``$$`` through to the shell, which
    # bash would misread as ``$$`` (the PID) plus a parameter
    # expansion. The whole shell script is therefore one single
    # quoted YAML scalar.
    command:
      - sh
      - -c
      - >-
        MODEL="$${LLM_MODEL:-nvidia/Qwen3.6-27B-NVFP4}";
        ARGS="$${MODEL} --host 0.0.0.0 --port 30000 --trust-remote-code --dtype bfloat16 --gpu-memory-utilization 0.9 --max-model-len $${LLM_MAX_MODEL_LEN:-32768}";
        if [ "$${LLM_ENABLE_MTP:-1}" = "1" ]; then
        ARGS="$${ARGS} --speculative-config {\"method\":\"mtp\",\"num_speculative_tokens\":3}";
        fi;
        exec vllm serve $${ARGS}
  neo4j:
    # Pinned 2026-06-26 (audit remediation R8). Quarterly review.
    image: neo4j:5.26.0
    # Neo4j 5.x enables ``server.config.strict_validation.enabled`` by
    # default. Any ``NEO4J_*`` env var that does not name a known
    # server setting makes the container exit 1 at startup — the
    # common failure modes in the wild are ``NEO4J_URI`` (read as
    # setting ``URI``), ``NEO4J_USER`` and ``NEO4J_PASSWORD`` (read
    # as ``USER`` / ``PASSWORD``). The only Neo4j-blessed auth env
    # var is ``NEO4J_AUTH`` in ``user/password`` form, so we build
    # it here from interpolation values and inject only that.
    #
    # The interpolation sources are NOT injected into the
    # container's environment: ``NEO4J_USER`` and ``NEO4J_PASSWORD``
    # are read from the project's ``.env`` for ``${...}``
    # substitution only, and the resulting string is the entire
    # value of the single ``NEO4J_AUTH`` env var we expose.
    # ``.env.neo4j`` (gitignored) is an optional override file —
    # set ``NEO4J_AUTH`` there directly to skip the interpolation.
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-REPLACE_ME}}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
