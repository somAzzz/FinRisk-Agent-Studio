services:
  neo4j:
    # The application connects to an externally managed OpenAI-compatible
    # LLM endpoint. Compose intentionally owns only the graph dependency.
    image: neo4j:5.26.0
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-REPLACE_ME}}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
